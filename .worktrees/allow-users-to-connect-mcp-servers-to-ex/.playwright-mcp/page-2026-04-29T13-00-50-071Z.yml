            - generic [ref=e172]: "# Spec: Streaming Test After Global Fix ## Overview Verifies that the WebSocket streaming pipeline works end-to-end after two fixes: (1) the `global.__processManager` singleton fix — previously, Next.js server actions and `server.ts` each loaded their own `ProcessManager` instance, so Orchestrator events never reached the WebSocket server; and (2) the `noServer: true` WebSocket fix — previously, registering `WebSocketServer` with `server` and `path: '/ws'` blocked Next.js HMR upgrades. Both fixes are in production. This test suite confirms agent events (xterm output in AgentPanel), phase-change events (kanban column updates), and HMR passthrough all work correctly under the current architecture. ## Requirements 1. When a task pipeline is started via `runTask()`, the ProcessManager instance used by the Orchestrator MUST be the same instance the WebSocket server (`server.ts`) is listening to. 2. Agent output events (`system`, `assistant`, `result`) emitted by a running pipeline MUST arrive at connected browser clients within 5 seconds of being emitted. 3. The AgentPanel xterm terminal MUST display the session init message (`◆ Session started — <model>`) once the first `system/init` event is received. 4. The AgentPanel MUST display at least one assistant text block or tool-use line while the agent is actively running. 5. Phase-change events MUST trigger a `router.refresh()` in `usePhaseSync`, causing the kanban board to re-render and move the task card to the new column. 6. The task card on the kanban board MUST advance from `backlog` → `spec` within 60 seconds of clicking Run. 7. The AgentPanel event counter (`{n} events`) MUST increment as the task runs — a count of 0 after 10 seconds with a running session is a failure. 8. Multiple open WebSocket connections (e.g. kanban + task detail panel open simultaneously) MUST both receive events without interference. 9. After the pipeline completes or is stopped, no further events MUST be delivered to that session's AgentPanel. 10. Reconnecting a WebSocket after disconnect MUST allow phase-change events to resume; no events already processed are re-delivered (events are not persisted in the WebSocket layer — this is by design). 11. All upgrade requests NOT at `/ws` (e.g. `/_next/webpack-hmr`) MUST NOT be intercepted by the `wss` — they must fall through so HMR continues to work in dev. 12. The React StrictMode double-mount of `useAgentStream` MUST NOT log a console error containing `\"WebSocket is closed before the connection is established\"`. ## Acceptance Criteria **AC-1: Agent events reach the browser** - Given: the TeamAI project is the active project, and there is a task in backlog - When: the user clicks Run Pipeline on the task card - Then: within 10 seconds, the AgentPanel terminal tab for that task displays `◆ Session started` **AC-2: Kanban board advances phase** - Given: a task card is visible in the Backlog column - When: Run Pipeline is clicked and the spec phase begins - Then: the task card disappears from Backlog and appears in the Spec column without a page reload **AC-3: Event counter increments** - Given: the task detail panel is open on the Terminal tab for a running task - When: 15 seconds have elapsed since the session started - Then: the \"N events\" counter in the AgentPanel header shows N > 0 **AC-4: No events before session start** - Given: a fresh task has never been run - When: the task detail panel is opened on the Terminal tab - Then: the AgentPanel xterm shows no content and the event counter reads \"0 events\" **AC-5: Phase-change causes board refresh** - Given: the kanban board is visible with a task in the Spec column - When: the pipeline advances to the Plan phase (emits a `phase-change` event) - Then: the task card moves from Spec → Planning column within 3 seconds **AC-6: Global singleton — no duplicate instances** - Given: the server is running and the TeamAI project is selected - When: `runTask` is called via a server action AND a WebSocket client is connected - Then: the WebSocket client receives events (proves the server action and WS server share the same ProcessManager instance) **AC-7: HMR upgrade passthrough** - Given: the dev server is running with `noServer: true` WebSocket configuration - When: Next.js HMR requests a WebSocket upgrade at `/_next/webpack-hmr` - Then: the HMR connection succeeds (no interruption to hot-module replacement) and the `/ws` endpoint remains functional simultaneously **AC-8: StrictMode no console error** - Given: React StrictMode is active (the default in Next.js dev) - When: a page with `useAgentStream` mounts and immediately unmounts (StrictMode double-invoke) - Then: the browser console contains no error or warning matching `\"WebSocket is closed before the connection is established\"` ## Files to Modify - `teamai/src/hooks/use-agent-stream.ts` — no changes expected; already correctly filters by `taskId` and checks `data.event !== undefined` - `teamai/src/hooks/use-phase-sync.ts` — no changes expected; correctly listens for `type === 'phase-change'` - `teamai/server.ts` — no changes expected; correctly wires `processManager` events to WebSocket broadcast ## New Files to Create - `teamai/e2e/streaming.spec.ts` — Playwright end-to-end test covering AC-1 through AC-8 - `teamai/playwright.config.ts` — Playwright config (baseURL: http://localhost:3000, webServer with `reuseExistingServer: true`) ## Dependencies & Risks - **Runtime dependency**: The test requires the TeamAI dev server to be running on port 3000 with the TeamAI project already imported as the active project. The Playwright config should use `webServer` with `reuseExistingServer: true` so it doesn't restart the server during testing. - **Agent availability**: AC-1, AC-2, AC-5 require a real Claude CLI subprocess to be spawned. If the API key is unavailable or rate-limited, these tests will fail. The test should assert xterm content appears within a generous timeout (30s) and skip cleanly if the session exits immediately with a non-zero code. - **xterm async init**: The AgentPanel lazy-imports xterm and mounts it asynchronously. Playwright must wait for the xterm canvas to appear in the DOM before asserting content, using `waitFor` or `locator.waitFor()`. - **No test isolation**: The streaming test modifies persistent state (creates tasks, spawns real agent sessions). Each run should create a uniquely-titled task so state from prior runs does not interfere; teardown should leave the task in a predictable terminal state. - **No historical events via WebSocket**: Events are not replayed on reconnect. If the browser connects after the session finishes, the AgentPanel will show 0 events. Tests must open the task panel *before* or *immediately after* clicking Run to observe events in flight."

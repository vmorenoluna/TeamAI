        - generic [ref=e45]:
          - paragraph [ref=e46]: "TeamAI is a self-hosted Next.js web application that orchestrates multi-agent Claude Code CLI workflows — replacing what would otherwise be manual, single-agent Claude sessions with a browser-based pipeline manager. The product is in early-stage development (v0.1.0) with a functioning core: Kanban board with drag-and-drop, WebSocket-based live streaming, 9-column pipeline (spec → plan → implement → QA → review → merge), devcontainer isolation, and PTY terminal sessions. The immediate priorities are hardening the pipeline against failures (P0), closing competitive feature gaps around multi-LLM support and autonomous execution (P1), and building the foundations for production readiness — test coverage, collaboration, and CI/CD integration (P2). The product is uniquely positioned as a self-hosted, private alternative to cloud-based AI coding agents like Devin, appealing to teams that value data sovereignty and customizable agent personas."
          - paragraph [ref=e47]: Competitor analysis was run for this roadmap.

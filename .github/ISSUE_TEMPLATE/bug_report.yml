name: Bug Report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much as you can — it makes reproducing the issue much faster.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11, macOS 15.1, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: TeamAI version
      description: Shown in Settings, or the installer/artifact filename you downloaded.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: Claude Code CLI version
      description: Output of `claude --version`.
      placeholder: "e.g. 2.1.59"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Terminal output, `output.log` excerpts, or screenshots. This will be rendered as-is, so no need for backticks.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Anything else?

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: TypeScript type check
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
        # Continue on warnings — only errors should fail
        continue-on-error: false

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: Vitest (unit + integration)
        run: npm test

  test-changelog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - name: CHANGELOG parsing
        run: bash tests/unit/changelog-parsing.test.sh

  # Fast parallel checks for quick feedback on PRs.
  # The `test-all` job below runs the full canonical suite independently.

  # AI review: runs after checks pass, only on PRs, only if API key is set
  ai-review:
    needs: [typecheck, lint, test]
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run AI PR review
        if: env.DEEPSEEK_API_KEY != ''
        run: node .github/scripts/ai-review.mjs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

  # Run the exact same command developers use locally: `npm run test:all`.
  # Serves as the single canonical CI gate — if this passes, all checks pass.
  # Runs independently (not gated on the fast parallel jobs) to avoid
  # redundant re-execution of typecheck/lint/vitest/changelog.
  test-all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Kill stale servers on port 3000
        run: |
          sudo lsof -ti:3000 | xargs -r sudo kill -9 2>/dev/null || true
          echo "Port 3000 cleared for E2E tests"
      - name: Kill stale servers on port 3001
        run: |
          sudo lsof -ti:3001 | xargs -r sudo kill -9 2>/dev/null || true
          echo "Port 3001 cleared for E2E tests"
      - name: Run full test suite
        run: npm run test:all
        env:
          CI: 'true'

  # Generate and upload code coverage reports as a CI artifact.
  # Runs independently of the auto-merge gate — coverage is informational.
  test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Kill stale servers on port 3000
        run: |
          sudo lsof -ti:3000 | xargs -r sudo kill -9 2>/dev/null || true
          echo "Port 3000 cleared for E2E tests"
      - name: Kill stale servers on port 3001
        run: |
          sudo lsof -ti:3001 | xargs -r sudo kill -9 2>/dev/null || true
          echo "Port 3001 cleared for E2E tests"
      - name: Run coverage suite
        run: npm run test:coverage
        env:
          CI: 'true'
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: teamai/coverage/
          retention-days: 7

  # Enable auto-merge when all checks pass (including AI review and test-all)
  auto-merge:
    needs: [test-all, ai-review]
    if: success() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

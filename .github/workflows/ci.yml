name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: TypeScript type check
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
        # Continue on warnings — only errors should fail
        continue-on-error: false

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: Vitest (unit + integration)
        run: npm test

  test-changelog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - name: CHANGELOG parsing
        run: bash tests/unit/changelog-parsing.test.sh

  test-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: teamai/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Kill stale servers on port 3000
        run: |
          sudo lsof -ti:3000 | xargs -r sudo kill -9 2>/dev/null || true
          echo "Port 3000 cleared for E2E tests"
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: 'true'

  # AI review: runs after checks pass, only on PRs, only if API key is set
  ai-review:
    needs: [typecheck, lint, test]
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run AI PR review
        if: env.DEEPSEEK_API_KEY != ''
        run: node .github/scripts/ai-review.mjs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

  # Enable auto-merge when all checks pass (including AI review and E2E)
  auto-merge:
    needs: [typecheck, lint, test, test-changelog, test-e2e, ai-review]
    if: success() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
